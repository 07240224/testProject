name: Build AutoClicker V2 APK (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.title == 'Build AutoClicker V2 APK 20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: build-autoclicker-v2-20260725

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: autoclicker-v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp autoclicker-v2/app/build/outputs/apk/debug/app-debug.apk AutoClicker-v2.0.apk
          sha256sum AutoClicker-v2.0.apk
          unzip -t AutoClicker-v2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-V2-APK
          path: AutoClicker-v2.0.apk
          if-no-files-found: error
