name: Download verified Muse Dash video from Internet - Invidious formats
on:
  push:
    branches: [chatgpt-video-download-20261027]
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg and requests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          python -m pip install -q requests
      - name: Resolve real MP4 and M4A media streams from target YouTube video
        shell: bash
        run: |
          mkdir -p downloaded
          python - <<'PY'
          import requests,pathlib,json,subprocess,hashlib,urllib.parse
          host='https://yt.chocolatemoo53.com'
          video='Mddqe6Vdcko'
          out=pathlib.Path('downloaded')
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36'})
          streams=[]
          reports=[]
          for params in ('','?local=true','?region=US&local=true'):
              try:
                  url=host+'/api/v1/videos/'+video+params
                  r=session.get(url,timeout=30)
                  print('INVIDIOUS_API',url,r.status_code,r.text[:120] if r.status_code!=200 else 'JSON',flush=True)
                  if r.status_code!=200:continue
                  x=r.json()
                  print('TITLE',x.get('title'),'DURATION',x.get('lengthSeconds'),flush=True)
                  for key in ('formatStreams','adaptiveFormats'):
                      fs=x.get(key) or []
                      print('FORMAT_KEY',key,'COUNT',len(fs),flush=True)
                      for f in fs:
                          desc={k:f.get(k) for k in ('itag','type','qualityLabel','bitrate','container','audioQuality','url') if f.get(k) is not None}
                          if desc.get('url'):desc['url']=desc['url'][:180]
                          print('FORMAT',json.dumps(desc,ensure_ascii=False),flush=True)
                          if f.get('url'): streams.append((f,key,url))
              except Exception as e:print('API_ERROR',type(e).__name__,str(e)[:200],flush=True)
          def tryfetch(f,key,i):
              remote=f['url'];u=urllib.parse.urlparse(remote)
              ct=f.get('type','')
              name='whatcha_'+str(i)+'_'+str(f.get('itag','n'))+('.m4a' if 'audio' in ct and 'video' not in ct else '.mp4')
              path=out/name
              try:
                  with session.get(remote,timeout=(12,30),stream=True,headers={'Referer':host+'/watch?v='+video}) as r:
                      print('MEDIA_HTTP',i,r.status_code,r.headers.get('content-type'),'DOMAIN',u.netloc,'LEN',r.headers.get('content-length'),flush=True)
                      r.raise_for_status()
                      n=0
                      with open(path,'wb') as w:
                          for block in r.iter_content(chunk_size=262144):
                              if block:w.write(block);n+=len(block)
                              if n>120_000_000:raise RuntimeError('size-limit')
                  p=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration,format_name','-of','json',str(path)],capture_output=True,text=True,timeout=20)
                  info=json.loads(p.stdout) if p.returncode==0 else {}
                  duration=float(info.get('format',{}).get('duration') or 0)
                  if duration<2:raise RuntimeError('invalid-video-duration')
                  reports.append({'name':name,'size':n,'source':remote[:180],'duration':duration,'type':ct,'codec':info.get('format',{}).get('format_name')})
                  print('DOWNLOADED_VALID_MEDIA',json.dumps(reports[-1]),flush=True)
                  return path
              except Exception as e:
                  print('MEDIA_ERROR',i,type(e).__name__,str(e)[:180],flush=True)
                  if path.exists():path.unlink()
                  return None
          # Prefer pre-muxed formats; if unavailable try adaptive video/audio tracks.
          premux=[(f,k,u) for f,k,u in streams if k=='formatStreams' and 'video' in f.get('type','')]
          vid=[(f,k,u) for f,k,u in streams if 'video' in f.get('type','')]
          aud=[(f,k,u) for f,k,u in streams if 'audio' in f.get('type','') and 'video' not in f.get('type','')]
          print('AVAILABLE',len(streams),'MUXED',len(premux),'VIDEO',len(vid),'AUDIO',len(aud),flush=True)
          actual=[]
          for i,(f,k,u) in enumerate(premux[:6]):
              p=tryfetch(f,k,i)
              if p:actual.append(p);break
          if not actual:
              for i,(f,k,u) in enumerate(vid[:8]):
                  p=tryfetch(f,k,i)
                  if p:actual.append(p);break
              for i,(f,k,u) in enumerate(aud[:7]):
                  p=tryfetch(f,k,i+100)
                  if p:actual.append(p);break
          if len(actual)==2:
              final=out/'Whatcha_Whatcha_Doin_Beginner_3_Internet_Download.mp4'
              p=subprocess.run(['ffmpeg','-y','-loglevel','error','-i',str(actual[0]),'-i',str(actual[1]),'-c','copy','-movflags','+faststart',str(final)],capture_output=True,text=True)
              if p.returncode==0 and final.exists():
                  print('FINAL_MP4_MERGED',final,final.stat().st_size,flush=True)
                  actual.append(final)
              else:print('MERGE_ERROR',p.stderr[:300],flush=True)
          if len(actual)==1 and actual[0].suffix=='.mp4':
              final=out/'Whatcha_Whatcha_Doin_Beginner_3_Internet_Download.mp4'
              actual[0].rename(final)
              actual=[final]
          for f in actual:
              sha=hashlib.sha256(f.read_bytes()).hexdigest()
              print('FINAL_DOWNLOADED_FILE',f,'BYTES',f.stat().st_size,'SHA256',sha,flush=True)
          (out/'report.json').write_text(json.dumps({'media':reports,'actual_files':[str(f) for f in actual]},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload actual downloaded video bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatcha-online-youtube-media
          path: downloaded/
          retention-days: 2
