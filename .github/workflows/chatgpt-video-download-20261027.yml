name: Download Bilibili combined video via guest relay
on:
  push:
    branches: [chatgpt-video-download-20261027]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download full MP4 from Bilibili remote relay
        shell: bash
        run: |
          mkdir -p downloaded
          python3 - <<'PY'
          import urllib.request,urllib.parse,urllib.error,subprocess,pathlib,json,hashlib,time
          bid="BV1sW4y197cE"
          root=pathlib.Path("downloaded")
          api="https://bili.rapi.rest/api/hybrid/video_data?"+urllib.parse.urlencode({"url":"https://www.bilibili.com/video/"+bid,"minimal":"1","proxy":"1"})
          def load_api():
              for i in range(3):
                  try:
                      req=urllib.request.Request(api,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
                      with urllib.request.urlopen(req,timeout=25) as r:
                          obj=json.load(r)
                          print("BILI_API",r.status,"KEYS",list(obj.keys()),flush=True)
                          print("DETAILS",str(obj.get("data",{}).get("video_data"))[:2300],flush=True)
                          return obj
                  except Exception as e:print("API_ERROR",str(e)[:220],flush=True)
              return None
          obj=load_api()
          if obj:
              vd=(obj.get("data") or {}).get("video_data") or {}
              for kind in ("mp4_url","video_url"):
                  target=vd.get(kind)
                  if not isinstance(target,str) or not target.startswith("https://bili.rapi.rest/"):
                      print("NO_LINK",kind,flush=True)
                      continue
                  f=root/(kind+".mp4")
                  print("TRY_VIDEO_DOWNLOAD",kind,target[:170],flush=True)
                  try:
                      cmd=["curl","-L","-sS","--retry","1","--connect-timeout","15","--max-time","160","--fail","-H","Referer: https://www.bilibili.com/","-A","Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36","-o",str(f),"-w","CURL_CODE:%{http_code} SIZE:%{size_download} SPEED:%{speed_download} FINAL:%{url_effective}",target]
                      rr=subprocess.run(cmd,text=True,capture_output=True,timeout=170)
                      print("CURL_EXIT",rr.returncode,rr.stdout[:180],rr.stderr[-700:],flush=True)
                      if not f.exists():continue
                      data=f.read_bytes()[:60]
                      print("BYTES",f.stat().st_size,"HEADER",data.hex(),flush=True)
                      if f.stat().st_size>10000 and b'ftyp' in data[:30]:
                          print("FULL_VIDEO_FILE_DOWNLOADED",str(f),f.stat().st_size,hashlib.sha256(f.read_bytes()).hexdigest(),flush=True)
                          break
                      f.unlink()
                  except Exception as e:print("CURL_EXCEPTION",str(e)[:230],flush=True)
          else:print("BILI_API_UNAVAILABLE",flush=True)
          PY
      - name: Upload internet video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-combined-video-from-internet
          path: downloaded/
          retention-days: 2
          if-no-files-found: warn
