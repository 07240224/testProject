name: Bilibili Internet MP4 test - third party proxy
on:
  push:
    branches: [chatgpt-video-download-20261027]
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          python -m pip install -q requests
      - name: Obtain Bilibili videos from third-party public proxy
        shell: bash
        run: |
          mkdir -p downloaded
          python - <<'PY'
          import requests,pathlib,json,urllib.parse,subprocess,hashlib,re,time
          out=pathlib.Path("downloaded");ss=requests.Session()
          ss.headers.update({"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/129.0.0.0 Safari/537.36","Referer":"https://www.bilibili.com/"})
          items=["BV1Sp4y1W723","BV1sW4y197cE","BV1X14y1F7Bj"]
          report=[]
          def info(label,url):
              try:
                  r=ss.get(url,timeout=(12,25))
                  body=r.text[:12000] if ('json' in r.headers.get('Content-Type','') or 'text' in r.headers.get('Content-Type','')) else ''
                  print("API_RESPONSE",label,r.status_code,r.headers.get('content-type'),r.url[:130],body[:1100].replace('\n',' '),flush=True)
                  if r.status_code!=200: return None
                  try:return r.json()
                  except:return None
              except Exception as e:print("API_ERROR",label,type(e).__name__,str(e)[:220],flush=True);return None
          def check(url,label):
              if not url.startswith('https://'):return False
              domain=urllib.parse.urlparse(url).hostname or ''
              if not (domain.endswith('.rapi.rest') or domain.endswith('.bilibili.com') or domain.endswith('.bilivideo.com') or domain.endswith('.bilivideo.cn') or domain == 'bili.rapi.rest'):return False
              target=out/(label+".mp4")
              try:
                  with ss.get(url,stream=True,timeout=(12,20)) as r:
                      print("STREAM",label,"HTTP",r.status_code,"TYPE",r.headers.get("content-type"),"LEN",r.headers.get("content-length"),flush=True)
                      r.raise_for_status()
                      size=0
                      with open(target,'wb') as f:
                          for chunk in r.iter_content(chunk_size=524288):
                              if chunk:
                                  f.write(chunk);size+=len(chunk)
                              if size>120_000_000:break
                  pr=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration,size:stream=codec_type","-of","json",str(target)],capture_output=True,text=True,timeout=20)
                  if pr.returncode:raise RuntimeError("ffprobe invalid file")
                  parsed=json.loads(pr.stdout);duration=float(parsed.get('format',{}).get('duration') or 0)
                  if duration<=1 or size<5000:raise RuntimeError("invalid duration")
                  sha=hashlib.sha256(target.read_bytes()).hexdigest()
                  res={"file":str(target),"size":size,"duration":duration,"sha256":sha,"url_host":domain,"streams":parsed.get('streams')}
                  report.append(res)
                  print("BILIBILI_VIDEO_SUCCESS",json.dumps(res),flush=True)
                  return True
              except Exception as e:
                  print("DOWNLOAD_FAILED",label,type(e).__name__,str(e)[:240],flush=True)
                  if target.exists():target.unlink()
                  return False
          def urls_from(x):
              urls=[]
              if isinstance(x,dict):
                  for k,v in x.items():
                      if isinstance(v,str) and v.startswith("http") and ('url' in k.lower() or 'proxy' in k.lower() or 'stream' in k.lower() or 'download' in k.lower()):
                          urls.append(v)
                      else:urls+=urls_from(v)
              if isinstance(x,list):
                  for y in x:urls+=urls_from(y)
              return list(dict.fromkeys(urls))
          for bvid in items:
              address="https://www.bilibili.com/video/"+bvid
              for minimal in ('1','true'):
                  params=urllib.parse.urlencode({'url':address,'minimal':minimal,'proxy':'1'})
                  data=info('RAPI_'+bvid+'_'+minimal,'https://bili.rapi.rest/api/hybrid/video_data?'+params)
                  if data:
                      print("RAPI_RESPONSE_KEYS",str(data)[:2800],flush=True)
                      links=urls_from(data)
                      print("RAPI_LINKS",bvid,[(urllib.parse.urlparse(u).hostname,u[:100]) for u in links[:20]],flush=True)
                      for i,remote in enumerate(links):
                          if ('mp4' in remote or 'kind=mp4' in remote or '/proxy?' in remote) and check(remote,'bili_rapi_'+bvid+'_'+str(i)):break
                      if report:break
              if report:break
          for bvid in items[:2]:
              if report:break
              data=info('bilidlcom_'+bvid,'https://bilidl.com/api/analyze?url='+urllib.parse.quote('https://www.bilibili.com/video/'+bvid,safe=''))
              if data:
                  for i,u in enumerate(urls_from(data)):
                      if check(u,'bilidl_'+bvid+'_'+str(i)):break
          if not report:
              for bvid in items[:2]:
                  j=info('RAPI_direct_'+bvid,'https://bili.rapi.rest/api/bilibili/web/bv_to_aid?bvid='+bvid)
          (out/'report.json').write_text(json.dumps({'videos':report},ensure_ascii=False,indent=2),encoding='utf-8')
          print('BILIBILI_FINAL_VERIFIED',len(report),flush=True)
          PY
      - name: Deliver downloaded media
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bilibili-internet-video-test
          path: downloaded/
          retention-days: 2
