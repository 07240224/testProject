name: Bilibili no-install internet media download
on:
  push:
    branches: [chatgpt-video-download-20261027]
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch video using Python standard library without dependency installation
        shell: bash
        run: |
          mkdir -p downloaded
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,pathlib,hashlib,time,traceback
          dest=pathlib.Path('downloaded')
          video_ids=['BV1Sp4y1W723','BV1sW4y197cE','BV1X14y1F7Bj']
          def fetch(url,limit=1000000):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/129.0.0.0 Safari/537.36','Referer':'https://www.bilibili.com/','Accept':'application/json,video/mp4,*/*'})
              with urllib.request.urlopen(req,timeout=14) as r:
                  print('HTTP',r.status,'CT',r.headers.get('Content-Type'),'FINALHOST',urllib.parse.urlparse(r.url).netloc,flush=True)
                  return r.read(limit)
          def links(data):
              out=[]
              if isinstance(data,dict):
                  for k,v in data.items():
                      if isinstance(v,str) and v.startswith('https://') and any(a in k.lower() for a in ('url','proxy','download','mp4','video')):out.append(v)
                      else:out.extend(links(v))
              elif isinstance(data,list):
                  for z in data:out.extend(links(z))
              return list(dict.fromkeys(out))
          success=[]
          for bv in video_ids:
              address='https://www.bilibili.com/video/'+bv
              urls=[
                'https://bili.rapi.rest/api/hybrid/video_data?'+urllib.parse.urlencode({'url':address,'minimal':'1','proxy':'1'}),
                'https://bili.rapi.rest/api/hybrid/video_data?'+urllib.parse.urlencode({'url':address,'minimal':'true','proxy':'true'}),
                'https://bilidl.com/api/analyze?'+urllib.parse.urlencode({'url':address})
              ]
              for url in urls:
                  try:
                      raw=fetch(url,150000)
                      print('RESPONSE',url.split('/')[2],raw[:1000].decode('utf-8','replace').replace('\n',' '),flush=True)
                      data=json.loads(raw)
                      options=links(data)
                      print('PROXY_MEDIA_LINKS',len(options),[urllib.parse.urlparse(z).netloc for z in options[:10]],flush=True)
                      for i,media in enumerate(options):
                          h=(urllib.parse.urlparse(media).hostname or '').lower()
                          if not (h.endswith('rapi.rest') or h.endswith('bilivideo.com') or h.endswith('bilivideo.cn') or h.endswith('bilibili.com')):continue
                          if ('mp4' not in media and 'proxy' not in media):continue
                          try:
                              data=fetch(media,50000000)
                              if len(data)>8000 and (b'ftyp' in data[:32] or b'moov' in data[:32]):
                                  f=dest/('internet_bilibili_'+bv+'_'+str(i)+'.mp4')
                                  f.write_bytes(data)
                                  d={'file':str(f),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'source':address}
                                  success.append(d)
                                  print('ACTUAL_BILIBILI_MP4_DOWNLOADED',d,flush=True)
                                  break
                          except Exception as e:print('DOWNLOAD_FAIL',type(e).__name__,str(e)[:220],flush=True)
                      if success:break
                  except Exception as e:print('API_FAILED',url.split('/')[2],bv,type(e).__name__,str(e)[:200],flush=True)
              if success:break
          (dest/'download-report.json').write_text(json.dumps(success,indent=2),encoding='utf-8')
          print('DONE_FILE_COUNT',len(success),flush=True)
          PY
      - name: Store downloaded Bilibili file
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bilibili-verified-internet-media-fast
          path: downloaded/
          retention-days: 2
